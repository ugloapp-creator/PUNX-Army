# fly.io  ->  fly launch --no-deploy   then   fly deploy
app = "punxarmy-rooms"
primary_region = "atl"          # Atlanta. Change to your crowd's nearest region.

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"   # scales to zero between musters
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options]
    # Rooms are long-lived WebSockets; do not cut them off mid-drill.
    idle_timeout = 900

  [[http_service.checks]]
    interval = "30s"
    timeout  = "5s"
    method   = "GET"
    path     = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
